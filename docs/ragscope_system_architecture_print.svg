<svg width="100%" viewBox="0 0 690 1112" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RAGScope system architecture diagram (simplified, print/light variant)</title>
<desc>Simplified research-pipeline architecture of the RAGScope RAG observability platform: data preparation, RAG query pipeline, evaluation, telemetry, dashboard, and experiments — six stages, each mapped to a specific research question or SMART objective. Deployment/Docker topology is described separately in docs/architecture.md rather than drawn here.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .hdr   { font-size: 12px; font-weight: 400; fill: rgb(85,83,76); }
  .rq    { font-size: 10px; font-weight: 400; fill: rgb(110,108,100); font-style: italic; }
  .title { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
  .sub   { font-size: 12px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .tiny  { font-size: 10px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .conn  { fill: none; stroke: rgb(120,118,108); stroke-width: 1.5px; }
  .box   { stroke-width: 0.75px; }
  .container { stroke-width: 0.75px; stroke-dasharray: 5 3; fill: none; }
</style>
</defs>

<rect x="0" y="0" width="690" height="1112" fill="rgb(255,255,255)"/>

<!-- ══════════════════════════════════════════════ TITLE ══════════════════════════════════════════════ -->
<text x="345" y="16" text-anchor="middle" font-size="15" font-weight="500" fill="rgb(30,28,24)">RAGScope — system architecture (simplified)</text>
<text x="345" y="33" text-anchor="middle" font-size="12" fill="rgb(85,83,76)">MSc Data Science Dissertation · Leeds Beckett University · 2026</text>
<text x="345" y="48" text-anchor="middle" font-size="10" fill="rgb(95,93,86)">Six stages, each mapped to a research question or SMART objective · deployment topology: see docs/architecture.md</text>

<!-- ══════════════════════════════════════════════ 1. DATA ══════════════════════════════════════════════ -->
<text x="36" y="66" class="hdr">── 1. Data — three benchmark corpora → preprocessing → index</text>
<rect x="28" y="74" width="624" height="96" rx="12" class="container" stroke="rgb(93,202,165)"/>

<g class="box" fill="rgb(8,80,65)" stroke="rgb(93,202,165)">
<rect x="44" y="90" width="180" height="64" rx="8"/>
</g>
<text x="134" y="112" class="title" fill="rgb(159,225,203)">3 Benchmark Corpora</text>
<text x="134" y="132" class="sub" fill="rgb(93,202,165)">MS MARCO · NQ · HotpotQA</text>
<text x="134" y="146" class="tiny" fill="rgb(93,202,165)">200 queries total</text>

<g class="box" fill="rgb(8,80,65)" stroke="rgb(93,202,165)">
<rect x="245" y="90" width="200" height="64" rx="8"/>
</g>
<text x="345" y="112" class="title" fill="rgb(159,225,203)">Preprocessing &amp; Indexing</text>
<text x="345" y="132" class="sub" fill="rgb(93,202,165)">clean → chunk → embed</text>
<text x="345" y="146" class="tiny" fill="rgb(93,202,165)">512-tok/64-overlap · MiniLM 384d</text>

<g class="box" fill="rgb(8,80,65)" stroke="rgb(93,202,165)">
<rect x="466" y="90" width="170" height="64" rx="8"/>
</g>
<text x="551" y="118" class="title" fill="rgb(159,225,203)">Retrieval Index</text>
<text x="551" y="138" class="sub" fill="rgb(93,202,165)">ChromaDB + BM25</text>

<line x1="224" y1="122" x2="243" y2="122" class="conn" marker-end="url(#arrow)" opacity="0.6"/>
<line x1="445" y1="122" x2="464" y2="122" class="conn" marker-end="url(#arrow)" opacity="0.6"/>

<line x1="340" y1="170" x2="340" y2="188" class="conn" marker-end="url(#arrow)" opacity="0.4"/>


<line x1="320" y1="510" x2="358" y2="510" class="conn" marker-end="url(#arrow)" opacity="0.6"/>

<line x1="340" y1="562" x2="340" y2="580" class="conn" marker-end="url(#arrow)" opacity="0.4"/>


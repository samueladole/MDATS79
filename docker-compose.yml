# ═══════════════════════════════════════════════════════════════════════════════
# RAGScope — Docker Compose
#
# Services
# ────────
#   chromadb     Vector store — persists embeddings across container restarts.
#   ragscope     Main application — RAG pipeline, evaluation engine, dashboard.
#
# Quick start
# ───────────
#   cp .env.example .env
#   docker compose up --build
#
# The dashboard is available at http://localhost:8501 once both services report
# healthy. Ollama runs on the host, so pull its models there first.
#
# Development
# ───────────
#   docker compose up --build --watch
#
# Syncs code edits into the running container (Streamlit reloads on save) and
# rebuilds the image when pyproject.toml or uv.lock change. See `develop:`.
#
# Storage
# ───────
#   chroma_data     Named volume: the embedded corpus.
#   telemetry_data  Named volume: query telemetry JSON logs.
#   ./data          Host folder: BM25 corpus, knowledge graph, your documents.
#   ./experiments/results  Host folder: benchmark CSVs and reports.
# ═══════════════════════════════════════════════════════════════════════════════

name: ragscope

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ragscope_net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  chroma_data:
    driver: local
  telemetry_data:
    driver: local

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    # Pinned: the server owns the on-disk index format, so a floating tag can
    # change it under an existing volume. 1.5.9 is the image (digest 1e0b73a1…)
    # that served the published index.
    image: chromadb/chroma:1.5.9
    container_name: ragscope_chromadb
    restart: unless-stopped
    networks:
      - ragscope_net
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_AUTHN_PROVIDER: ""      # No auth in local research context
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c \"exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── RAGScope Application ───────────────────────────────────────────────────
  ragscope:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: app   # the runtime stage; `builder` only installs dependencies
      # Pass build-time args if needed (e.g. for private package registries)
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ragscope:latest
    container_name: ragscope_app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ragscope_net
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      # Persist telemetry JSON logs to a named volume so query history
      # survives container recreation.
      - telemetry_data:/app/telemetry/store
      # Persist experiment results to the host for direct file access.
      - ./experiments/results:/app/experiments/results
      # Ingestion writes the BM25 corpus here, and the graph and your documents
      # live here. Without this mount they would sit in the container layer and
      # be lost whenever the container is recreated. data/ also holds the
      # loader code, which comes from the same checkout as the image.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_MODE: http       # containers use the chromadb service, whatever .env says
      CHROMA_HOST: chromadb
      # Reload the dashboard when watch mode syncs a changed file. Harmless
      # otherwise: nothing changes the code inside a container that is not
      # being watched.
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
    # `docker compose up --watch`: development without rebuilding by hand.
    develop:
      watch:
        # Code edits are copied into the running container. Paths listed in
        # .dockerignore are skipped automatically.
        - action: sync
          path: .
          target: /app
          ignore:
            - data/          # already mounted from the host
            - .venv/
        # A dependency change needs a new image, and rebuilding gives the
        # container a fresh virtual environment.
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

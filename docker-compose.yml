# ═══════════════════════════════════════════════════════════════════════════════
# RAGScope — Docker Compose (Production / Research)
#
# Services
# ────────
#   chromadb     Vector store — persists embeddings across container restarts.
#   ragscope     Main application — RAG pipeline, evaluation engine, dashboard.
#
# Quick start
# ───────────
#   cp .env.example .env
#   docker compose up --build
#
# The dashboard is available at http://localhost:8501 once all services report
# healthy. On first boot, expect 10–20 minutes for model downloads.
#
# Volumes
# ───────
#   chroma_data     Persists embedded corpus between restarts.
#   telemetry_data  Persists query telemetry JSON logs between restarts.
# ═══════════════════════════════════════════════════════════════════════════════

name: ragscope

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  ragscope_net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  chroma_data:
    driver: local
  telemetry_data:
    driver: local

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── ChromaDB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: ragscope_chromadb
    restart: unless-stopped
    networks:
      - ragscope_net
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      CHROMA_SERVER_AUTHN_PROVIDER: ""      # No auth in local research context
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c \"exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── RAGScope Application ───────────────────────────────────────────────────
  ragscope:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # Pass build-time args if needed (e.g. for private package registries)
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: ragscope:latest
    container_name: ragscope_app
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ragscope_net
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      # Persist telemetry JSON logs to a named volume so query history
      # survives container recreation.
      - telemetry_data:/app/telemetry/store
      # Persist experiment results to the host for direct file access.
      - ./experiments/results:/app/experiments/results
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

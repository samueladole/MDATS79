<svg width="100%" viewBox="0 0 640 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Composite hallucination risk score: formula and risk bands</title>
<desc>Figure showing how the composite hallucination risk score is computed as a weighted combination of answer faithfulness (weight 0.6) and context relevance (weight 0.4), inverted so higher values indicate higher risk, and classified into LOW, MEDIUM, and HIGH bands.</desc>

<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
  text { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .title  { font-size: 12.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .sub    { font-size: 10.5px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .conn   { fill: none; stroke: rgb(120,118,108); stroke-width: 1.5px; }
  .box    { stroke-width: 1px; }
  .band   { font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; fill: rgb(255,255,255); }
  .tick   { font-size: 10px; text-anchor: middle; fill: rgb(60,58,52); }
</style>
</defs>

<rect x="0" y="0" width="640" height="340" fill="rgb(255,255,255)"/>

<!-- Title -->
<text x="320" y="20" text-anchor="middle" font-size="14" font-weight="500" fill="rgb(30,28,24)">Figure 3.5 &#8212; Composite Hallucination Risk Score</text>
<text x="320" y="37" text-anchor="middle" font-size="10.5" fill="rgb(95,93,86)">evaluation/hallucination_score.py</text>

<!-- Inputs -->
<g class="box" fill="rgb(113,43,19)" stroke="rgb(240,153,123)">
<rect x="60" y="54" width="230" height="52" rx="8"/>
</g>
<text x="175" y="74" class="title" fill="rgb(255,255,255)">Answer Faithfulness</text>
<text x="175" y="92" class="sub" fill="rgb(250,214,199)">weight 0.6</text>

<g class="box" fill="rgb(113,43,19)" stroke="rgb(240,153,123)">
<rect x="350" y="54" width="230" height="52" rx="8"/>
</g>
<text x="465" y="74" class="title" fill="rgb(255,255,255)">Context Relevance</text>
<text x="465" y="92" class="sub" fill="rgb(250,214,199)">weight 0.4</text>

<path d="M175 106 L175 122 L320 122 L320 130" fill="none" class="conn" marker-end="url(#arrow4)" opacity="0.6"/>
<path d="M465 106 L465 122 L320 122" fill="none" class="conn" opacity="0.6"/>

<!-- Formula -->
<g class="box" fill="rgb(68,68,65)" stroke="rgb(180,178,169)">
<rect x="90" y="132" width="460" height="46" rx="8"/>
</g>
<text x="320" y="159" text-anchor="middle" font-size="13" font-weight="600" fill="rgb(255,255,255)">Risk = 1 &#8722; (0.6 &#215; Faithfulness + 0.4 &#215; Context Relevance)</text>

<line x1="320" y1="178" x2="320" y2="196" class="conn" marker-end="url(#arrow4)" opacity="0.6"/>

<!-- Gauge -->
<text x="320" y="216" text-anchor="middle" font-size="11" font-weight="500" fill="rgb(30,28,24)">Risk Bands</text>

<!-- bar 40..600 = 560px wide, 0..1 scale -->
<!-- LOW 0-0.35 -> 196px, MEDIUM 0.35-0.65 -> 168px, HIGH 0.65-1.0 -> 196px -->
<rect x="40" y="228" width="196" height="44" fill="rgb(46,204,113)"/>
<text x="138" y="250" class="band">LOW</text>
<rect x="236" y="228" width="168" height="44" fill="rgb(243,156,18)"/>
<text x="320" y="250" class="band">MEDIUM</text>
<rect x="404" y="228" width="196" height="44" fill="rgb(231,76,60)"/>
<text x="502" y="250" class="band">HIGH</text>

<!-- tick marks -->
<line x1="40" y1="272" x2="40" y2="280" stroke="rgb(120,118,108)" stroke-width="1"/>
<text x="40" y="292" class="tick">0.00</text>
<line x1="236" y1="272" x2="236" y2="280" stroke="rgb(120,118,108)" stroke-width="1"/>
<text x="236" y="292" class="tick">0.35</text>
<line x1="404" y1="272" x2="404" y2="280" stroke="rgb(120,118,108)" stroke-width="1"/>
<text x="404" y="292" class="tick">0.65</text>
<line x1="600" y1="272" x2="600" y2="280" stroke="rgb(120,118,108)" stroke-width="1"/>
<text x="600" y="292" class="tick">1.00</text>

<text x="320" y="316" text-anchor="middle" font-size="10" fill="rgb(95,93,86)">Thresholds derived from preliminary calibration against answer correctness on a pilot sample (&#167;3.8.2)</text>

</svg>

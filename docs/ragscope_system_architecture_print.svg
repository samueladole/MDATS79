<line x1="320" y1="650" x2="358" y2="650" class="conn" marker-end="url(#arrow)" opacity="0.6"/>

<line x1="340" y1="698" x2="340" y2="716" class="conn" marker-end="url(#arrow)" opacity="0.4"/>


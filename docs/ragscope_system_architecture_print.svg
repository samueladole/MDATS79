<line x1="340" y1="422" x2="340" y2="440" class="conn" marker-end="url(#arrow)" opacity="0.4"/>

<!-- ══════════════════════════════════════════════ 3. EVALUATION ══════════════════════════════════════════════ -->
<text x="36" y="454" class="hdr">── 3. Evaluation <tspan class="rq">(RQ1: hallucination-risk calibration)</tspan></text>
<rect x="28" y="462" width="624" height="100" rx="12" class="container" stroke="rgb(240,153,123)"/>


# ═══════════════════════════════════════════════════════════════════════════════
# RAGScope — Docker Compose Override (Development)
#
# Extends docker-compose.yml for local development. Activates:
#   - Source volume mount → code changes reflected without rebuilding the image
#   - Streamlit hot-reload (--server.runOnSave=true)
#   - More permissive restart policy for faster iteration
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up
#
# Or, set COMPOSE_FILE in your shell to avoid typing it every time:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml
#   docker compose up
# ═══════════════════════════════════════════════════════════════════════════════

name: ragscope

services:

  # ── RAGScope (dev mode) ────────────────────────────────────────────────────
  ragscope:
    # Mount the entire source tree so edits on the host are reflected
    # immediately inside the container without a rebuild.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app                              # Source mount (overrides image source)
      - /app/.venv                          # Preserve the venv from the image layer
                                            # (prevents the host mount from shadowing it)
      - telemetry_data:/app/telemetry/store
      - ./experiments/results:/app/experiments/results
    environment:
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"  # Hot-reload on file save
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: auto
      STREAMLIT_LOGGER_LEVEL: debug
      PYTHONDONTWRITEBYTECODE: "1"
    # Override the default entrypoint to start Streamlit directly
    # without waiting for Ollama/ChromaDB (useful during pure UI development).
    # Comment this out to restore the full health-check entrypoint.
    # command: streamlit run dashboard/app.py --server.runOnSave=true
